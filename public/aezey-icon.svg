<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="aezey_blue_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="40%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="aezey_cyan_glow" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>
    <linearGradient id="aezey_dark_fold" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#0A1931"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00D2FF" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Left Main Leg / Backbone of A -->
  <path d="M52 14 L20 85 C17 92 21 99 29 99 L38 99 L60 48 L46 22 Z" fill="url(#aezey_dark_fold)"/>
  
  <!-- Outer Bevel Highlight Left -->
  <path d="M52 14 L20 85 C18 90 22 95 27 95 L34 95 L58 42 Z" fill="url(#aezey_blue_grad)"/>

  <!-- Right Dynamic Fold & Swoop -->
  <path d="M52 14 L78 72 C81 78 77 86 70 88 L52 92 L62 70 L48 40 Z" fill="url(#aezey_blue_grad)"/>
  
  <!-- Lower Sharp Bevel / Inner Wing -->
  <path d="M36 82 L72 82 L84 99 L32 99 Z" fill="#0B132B"/>
  <path d="M40 85 L76 85 L84 97 L36 97 Z" fill="url(#aezey_blue_grad)"/>

  <!-- Glowing Cyan Wing Accent -->
  <path d="M48 78 L68 78 L60 96 C50 94 44 88 48 78 Z" fill="url(#aezey_cyan_glow)" filter="url(#glow)"/>

  <!-- Circuit Lines & Nodes Branching Right -->
  <!-- Top Trace -->
  <path d="M66 50 L84 50 L92 42 L102 42" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="104" cy="42" r="3.5" fill="#00F0FF" filter="url(#glow)"/>

  <!-- Middle Trace -->
  <path d="M70 60 L90 60 L98 56 L108 56" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="110" cy="56" r="3.5" fill="#38BDF8"/>

  <!-- Lower Trace -->
  <path d="M68 68 L86 68 L94 76 L104 76" stroke="#0284C7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="106" cy="76" r="3.5" fill="#0284C7"/>
  
  <!-- Micro Trace Node -->
  <path d="M74 55 L82 55 L88 64 L96 64" stroke="#00D2FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="98" cy="64" r="2.5" fill="#00F0FF"/>
</svg>
